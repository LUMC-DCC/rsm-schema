[project]
name = "rsm-schema"
version = "1.0.0"
description = "Python access to the RSM JSON Schema, generated Pydantic models, and schema inspection utilities."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<4.0"
keywords = ["json-schema", "metadata", "pydantic", "research-software"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
authors = [
    # ORCID: https://orcid.org/0000-0002-0852-4752
    { name = "Mariia Steeghs-Turchina", email = "m.a.steeghs-turchina@lumc.nl" },
]
maintainers = [
    # ORCID: https://orcid.org/0000-0002-0852-4752
    { name = "Mariia Steeghs-Turchina", email = "m.a.steeghs-turchina@lumc.nl" },
    # ORCID: https://orcid.org/0000-0002-9839-5439
    { name = "Anna Niehues", email = "a.niehues@lumc.nl" },
]
dependencies = [
    "pydantic[email]>=2.13,<3.0",
    "jsonschema>=4.0,<5.0",
]

[project.urls]
Homepage = "https://lumc-dcc.github.io/rsm-schema/"
Repository = "https://github.com/LUMC-DCC/rsm-schema"
Issues = "https://github.com/LUMC-DCC/rsm-schema/issues"
Documentation = "https://lumc-dcc.github.io/rsm-schema/"

[tool.poetry]
packages = [{ include = "rsm_schema", from = "src" }]
include = [
    { path = "src/rsm_schema/schema/*.json", format = ["sdist", "wheel"] },
    { path = "src/rsm_schema/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
datamodel-code-generator = { version = ">=0.56,<1.0", extras = ["ruff"] }
pre-commit = ">=4.2,<5.0"
pytest = ">=8.0,<10.0"
ruff = ">=0.12,<1.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=8.1,<10.0"
# conf.py sorts the archived schema versions; Sphinx pulls this in anyway, but
# the docs build depends on it directly, so it is declared directly.
packaging = ">=24.0"
myst-parser = ">=4.0,<5.0"
sphinx-book-theme = ">=1.1,<2.0"
sphinx-copybutton = ">=0.5,<1.0"
sphinxcontrib-mermaid = ">=1.0,<2.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "D105",
    "D107",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Generated by datamodel-code-generator
"src/rsm_schema/generated/models.py" = ["D", "N", "E501", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.datamodel-codegen]
input = "src/rsm_schema/schema/rsm.schema.json"
input-file-type = "jsonschema"
output = "src/rsm_schema/generated/models.py"
output-model-type = "pydantic_v2.BaseModel"
preset = "practical-py314-20260619"
formatters = ["ruff-check", "ruff-format"]
